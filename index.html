<!DOCTYPE html>
<html lang="en">
<head>

  <title>For Adi ❤️</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="hearts" aria-hidden="true"></div>

  <main class="card">

    <div class="from">From Somya ❤️</div>
    <h1>Adi, are you still<br>angry with me?</h1>

    <div class="buttons">
      <button id="yesBtn">Yes, still angry 😤</button>
      <button id="noBtn">No, I'm not ❤️</button>
    </div>

    <p id="response" class="response"></p>
  </main>

  <script src="script.js"></script>
</body>
</html>
